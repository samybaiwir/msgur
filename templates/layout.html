<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16x16.png">
    <link rel="icon" href="/static/img/favicon.ico">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">

    <title>{% block title %}{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;600;700;800;900&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link href="/static/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gxD6x9bgukFGl3FYOQ3fLMFdmaQyYtMdUGt72V5C0CqJXLCN+SitZWeABn2B7ir7" crossorigin="anonymous">
    <link href="/static/css/msgur.css" rel="stylesheet">

    <script src="/static/js/crypto-js.min.js"></script>
    <script src="/static/js/jquery-3.6.0.min.js"></script>
    <script src="/static/js/uuid.min.js"></script>
    <script src="/static/js/msgur.js"></script>
</head>

<body>
    <main>
    <header class="p-3 bg-dark text-white">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
          <a href="/" class="d-flex align-items-center my-2 my-lg-0 me-lg-auto text-decoration-none">
            <span class="wordmark"><span class="sym">&gt;</span><span class="name">secret</span><span class="sym">_</span></span>
          </a>

          <ul class="nav nav-pills col-12 col-lg-auto my-2 justify-content-center my-md-0">
            <li class="nav-item"><a href="/" class="nav-link{{ ' active' if activepage == 'home' }}">Home</a></li>
            <li class="nav-item"><a href="/about" class="nav-link{{ ' active' if activepage == 'about' }}">About</a></li>
          </ul>
        </div>
      </div>
    </header>

    <div class="container py-4">
        {% block content %}
        {% endblock %}

        <footer>
        <img src="/static/img/logo-parrot-centered-alpha.png" alt="" class="parrot-watermark">
        <div class="py-4 my-4 border-top">
            <p class="mb-1">Built on <a href="https://github.com/maxux/msgur" target="_blank" rel="noopener">msgur</a>
                by Maxime Daniel (<a href="https://github.com/maxux" target="_blank" rel="noopener">@maxux</a>)
                &middot; Branded &amp; extended by <a href="https://cybernoob.io" target="_blank" rel="noopener">Cybernoob</a></p>
            <div class="d-flex justify-content-between">
                <p class="mb-0">&copy; {{ now.year }} Cybernoob</p>
                <ul class="list-unstyled d-flex mb-0">
                    <li class="ms-3">Revision: <code>{{ revision }}</code></li>
                </ul>
            </div>
        </div>
        </footer>
      </div>
    </main>
</body>
</html>
